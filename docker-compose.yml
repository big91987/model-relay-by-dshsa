services:
  gateway:
    build:
      context: .
      args:
        VERSION: 0.1.0
    image: model-relay:0.1.0
    ports:
      - "8080:8080"
    # SECRET_KEY and ADMIN_PASSWORD are loaded from .env; see README.md.
    env_file:
      - .env
    volumes:
      - relay-data:/data
    restart: unless-stopped

volumes:
  relay-data:
